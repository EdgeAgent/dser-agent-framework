[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dser-agent-framework"
version = "0.1.0"
description = "A provenance-aware dual-stream reconciliation framework for tool-using AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]
license = {file = "LICENSE"}
authors = [
  {name = "Manus AI"}
]
keywords = ["ai-agents", "memory", "provenance", "verification", "agent-framework"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries",
]

[project.scripts]
dser-cli = "dser.cli:main"
dser-demo = "dser.web_demo:main"

[project.urls]
Repository = "https://github.com/EdgeAgent/dser-agent-framework"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
